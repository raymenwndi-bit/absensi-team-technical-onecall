<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Technical Onecall</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.w{max-width:700px;margin:auto;padding:15px}.h{background:#2563eb;color:white;padding:22px;border-radius:20px}.c{background:white;padding:16px;border-radius:18px;margin-top:12px}input,button{width:100%;padding:13px;box-sizing:border-box;margin:5px 0;border-radius:12px;border:1px solid #ddd;font-size:16px}button{background:#2563eb;color:white;border:0;font-weight:bold}.s{background:#eef3ff;color:#2563eb}video{width:100%;background:#111;border-radius:15px}img{width:100%;border-radius:15px}.hide{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}table{width:100%;font-size:13px;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}</style></head><body><div class="w"><div class="h"><h1>📸 Team Technical Onecall</h1>Absensi Selfie + GPS</div><div id="login" class="c"><h2>Login</h2><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">Masuk</button></div><div id="app" class="hide"><div class="c"><h2 id="hi"></h2><video id="v" autoplay playsinline></video><div class="row"><button onclick="cam()">📷 Kamera</button><button class="s" onclick="snap()">📸 Selfie</button></div><img id="im" class="hide"><div id="gps">📍 GPS belum diambil</div><div class="row"><button onclick="abs('Masuk')">✅ Masuk</button><button onclick="abs('Pulang')">🏁 Pulang</button></div><p id="m"></p></div><div class="c"><h3>Riwayat</h3><div id="hist"></div><button class="s" onclick="location.reload()">Keluar</button></div></div><div id="admin" class="hide"><div class="c"><h2>Dashboard Admin</h2><button onclick="location='/api/export.csv'">⬇️ Export CSV</button><div id="all"></div><button class="s" onclick="location.reload()">Keluar</button></div></div></div><script>
let token="",me,stream,photo,pos;const $=x=>document.getElementById(x);async function api(u,o={}){o.headers={...(o.headers||{}),...(token?{Authorization:token}:{})};let r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Gagal");return d}
async function login(){try{let d=await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("u").value,password:$("p").value})});token=d.token;me=d.user;$("login").classList.add("hide");if(me.role==="admin"){$("admin").classList.remove("hide")}else{$("app").classList.remove("hide");$("hi").textContent="Halo, "+me.name}load()}catch(e){alert(e.message)}}
async function cam(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});$("v").srcObject=stream}catch(e){alert("Kamera membutuhkan HTTPS dan izin kamera.")}}
function snap(){let v=$("v");if(!v.videoWidth)return alert("Buka kamera dulu");let c=document.createElement("canvas"),s=Math.min(900/v.videoWidth,1);c.width=v.videoWidth*s;c.height=v.videoHeight*s;c.getContext("2d").drawImage(v,0,0,c.width,c.height);photo=c.toDataURL("image/jpeg",.78);$("im").src=photo;$("im").classList.remove("hide");stream?.getTracks().forEach(t=>t.stop());navigator.geolocation?.getCurrentPosition(x=>{pos=x.coords;$("gps").textContent="📍 GPS siap"},()=>{$("gps").textContent="📍 GPS tidak tersedia"})}
async function abs(type){if(!photo)return alert("Ambil selfie");try{await api("/api/attendance",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type,photo,lat:pos?.latitude,lng:pos?.longitude,accuracy:pos?.accuracy})});$("m").textContent="✅ Absensi berhasil";photo=null;load()}catch(e){$("m").textContent=e.message}}
async function load(){let d=await api("/api/attendance");let h=d.length?"<table><tr><th>Nama</th><th>Tipe</th><th>Waktu</th></tr>"+d.map(x=>"<tr><td>"+x.name+"</td><td>"+x.type+"</td><td>"+new Date(x.time).toLocaleString("id-ID")+"</td></tr>").join("")+"</table>":"Belum ada data";if(me.role==="admin")$("all").innerHTML=h;else $("hist").innerHTML=h}
</script></body></html>
